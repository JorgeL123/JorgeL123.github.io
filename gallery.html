  <!-- Optional: dynamically sync theme color with background -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  const navMeta = document.querySelector('meta[name="msapplication-navbutton-color"]');
  const appleMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');

  const colors = ["#9dbabd", "#8abfc3", "#5f8c8e"];
  let i = 0;

  function applyColor(c) {
    if (themeMeta) themeMeta.setAttribute("content", c);
    if (navMeta) navMeta.setAttribute("content", c);
    if (appleMeta) appleMeta.setAttribute("content", c);
    // trigger a repaint safely
    window.matchMedia("(prefers-color-scheme: light)").matches; 
  }

  applyColor(colors[0]); // initial color
  setInterval(() => {
    i = (i + 1) % colors.length;
    applyColor(colors[i]);
  }, 6000);
});
</script>

<script>
  // --- Lightbox logic ---
  const galleryImages = document.querySelectorAll('.gallery-item img');

  // Create the overlay element
  const lightbox = document.createElement('figure');
  lightbox.classList.add('lightbox');
  lightbox.innerHTML = `
    <img src="" alt="">
    <figcaption></figcaption>
  `;
  document.body.appendChild(lightbox);

  const lightboxImg = lightbox.querySelector('img');
  const lightboxCaption = lightbox.querySelector('figcaption');

  // Open on click
  galleryImages.forEach(img => {
    img.addEventListener('click', () => {
      lightboxImg.src = img.src;
      lightboxCaption.textContent = img.alt || '';
      //lightboxCaption.textContent = img.closest('figure').querySelector('figcaption').textContent;
      lightbox.classList.add('active');
    });
  });

  // Close on click or Esc
  lightbox.addEventListener('click', () => {
    lightbox.classList.remove('active');
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') lightbox.classList.remove('active');
  });
</script>
